name: 'Execução da Pipeline de CI'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 2,4,6'

# Ativa o Node.js 24 por padrão para sumir com os avisos de depreciação
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_FLAGS_SUPPRESS_DEPRECATIONS: true


jobs:
  inspecao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Instalando dependências
        run: npm install

      - name: Inspeção de Código
        run: npm run lint

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Instalando dependências
        run: npm install

      - name: Rodando testes unitários
        run: npm run test

      - name: Salvando relatórios de testes
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          path: ./mochawesome-report
          name: Relatório de Testes Unitários

  deploy:
    runs-on: ubuntu-latest
    needs: [unidade]

    steps:
      - name: Simulação de Deploy
        run: echo 'Deploy sendo realizado...'